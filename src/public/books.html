<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración de Libros - Entre Libros</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a href="/" class="brand">
      <span class="mark">EL</span>
      <span><b>Entre Libros</b><small>Inventario</small></span>
    </a>
    <div class="top-right"><span class="badge">Admin</span><a href="/login.html" class="avatar">👤</a></div>
  </header>

  <div class="pagehead">
    <div>
      <h1>Administración de Libros</h1>
      <p>Control centralizado del acervo bibliográfico</p>
    </div>
    <a href="/libro.html" class="btn">+ Nuevo Libro</a>
  </div>

  <!-- CONTADORES -->
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><small>Total</small></div>
    <div class="stat g"><b id="sDisp">0</b><small>Disponibles</small></div>
    <div class="stat b"><b id="sPrest">0</b><small>Prestados</small></div>
    <div class="stat"><b id="sInact">0</b><small>Inactivos</small></div>
  </div>

  <!-- MENSAJE DE ÉXITO -->
  <div class="ok" id="okMsg">
    <span>✅</span>
    <div><strong>¡Libro guardado exitosamente!</strong><span id="okTxt"></span></div>
    <button onclick="document.getElementById('okMsg').classList.remove('show')" aria-label="Cerrar">✕</button>
  </div>

  <!-- REGISTRO DE LIBRO -->
  <div class="card" id="panelNuevo">
    <h2 style="margin-bottom:.8rem">Registro de Libro</h2>
    <form id="formLibro">
      <label for="titulo">Título del libro *</label>
      <input type="text" id="titulo" placeholder="Ej. El Principito o Cien Años de Soledad" maxlength="80" required>

      <label for="autor">Autor *</label>
      <input type="text" id="autor" placeholder="Ej. Robert C. Martin" required>

      <label for="editorial">Editorial *</label>
      <input type="text" id="editorial" placeholder="Ej. Prentice Hall" required>

      <label for="isbn">Código ISBN *</label>
      <input type="text" id="isbn" placeholder="978-0132350884" required>

      <label for="año_publicacion">Año de publicación *</label>
      <input type="number" id="año_publicacion" placeholder="Ej. 2008" required>

      <label for="categoria">Categoría / Temática *</label>
      <select id="categoria" required>
        <option value="">Selecciona una categoría editorial</option>
        <option>Tecnología</option><option>Novela</option><option>Literatura</option>
        <option>Ciencia</option><option>Historia</option><option>Filosofía</option><option>Infantil</option>
      </select>

      <label>Ejemplares en inventario *</label>
      <div class="stepper">
        <span><b>Unidades físicas</b></span>
        <div>
          <button type="button" onclick="paso(-1)">−</button>
          <input type="number" id="cantidad_total" value="1" min="1" required>
          <button type="button" onclick="paso(1)">+</button>
        </div>
      </div>

      <button type="submit" class="btn block" style="margin-top:1rem">Guardar Libro</button>
    </form>
  </div>

  <!-- BUSCADOR Y FILTROS -->
  <div class="search">
    <div class="field"><i>🔍</i>
      <input type="text" id="searchTitulo" placeholder="Buscar por título..." onkeyup="if(event.key==='Enter')cargarLibros()">
    </div>
    <button class="btn ghost" onclick="document.getElementById('filtros').classList.toggle('show')" aria-label="Más filtros">⚙️</button>
    <button class="btn" onclick="cargarLibros()">Buscar</button>
  </div>
  <div class="filters" id="filtros">
    <input type="text" id="searchAutor" placeholder="Autor...">
    <input type="text" id="searchCategoria" placeholder="Categoría...">
  </div>

  <div class="chips">
    <strong style="font-size:.8rem;align-self:center">Categoría:</strong>
    <button class="chip" onclick="filtrar('Tecnología',this)">Tecnología</button>
    <button class="chip" onclick="filtrar('Literatura',this)">Literatura</button>
    <button class="chip" onclick="filtrar('Ciencia',this)">Ciencia</button>
    <button class="chip" onclick="filtrar('Historia',this)">Historia</button>
    <button class="chip on" onclick="filtrar('',this)">Ver Todas</button>
  </div>

  <!-- LISTA DE LIBROS -->
  <div id="tablaLibros"></div>

</div>

<nav class="bottom">
  <a href="/index.html"><span>📖</span>Explorar</a>
  <a href="/catalogo.html"><span>📖</span>Explorar</a>
  <a href="#"><span>🔖</span>Préstamos</a>
  <a href="/books.html" class="on"><span>🗃️</span>Inventario</a>
  <a href="/login.html"><span>⚙️</span>Perfil</a>
</nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
  cargarLibros();
  const p = new URLSearchParams(location.search);
  if (p.get('guardado')) {
    document.getElementById('okTxt').textContent = ` El registro de '${p.get('guardado')}' fue guardado en el catálogo.`;
    document.getElementById('okMsg').classList.add('show');
    history.replaceState(null, '', '/books.html');
  }
});

function paso(n){
  const i = document.getElementById('cantidad_total');
  i.value = Math.max(1, (parseInt(i.value) || 1) + n);
}

function filtrar(cat, btn){
  document.getElementById('searchCategoria').value = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  cargarLibros();
}

async function cargarLibros() {
  const titulo = document.getElementById('searchTitulo').value.trim();
  const autor = document.getElementById('searchAutor').value.trim();
  const categoria = document.getElementById('searchCategoria').value.trim();

  const params = new URLSearchParams();
  if (titulo) params.append('titulo', titulo);
  if (autor) params.append('autor', autor);
  if (categoria) params.append('categoria', categoria);

  const url = `/api/books?${params.toString()}`;

  try {
    const res = await fetch(url);
    const libros = await res.json();

    if (!Array.isArray(libros)) {
      console.error('Respuesta inesperada:', libros);
      return;
    }

    // Contadores
    document.getElementById('sTotal').textContent = libros.length;
    document.getElementById('sDisp').textContent = libros.filter(l => l.activo && l.cantidad_disponible > 0).length;
    document.getElementById('sPrest').textContent = libros.reduce((s, l) => s + (l.cantidad_total - l.cantidad_disponible), 0);
    document.getElementById('sInact').textContent = libros.filter(l => !l.activo).length;

    const cont = document.getElementById('tablaLibros');
    cont.innerHTML = libros.length ? '' : '<p class="empty">No hay libros con ese filtro.</p>';

    libros.forEach(libro => {
      const prestados = libro.cantidad_total - libro.cantidad_disponible;
      cont.innerHTML += `
        <article class="book">
          <div class="book-top">
            <div class="cover"></div>
            <div class="book-info">
              <h2>${libro.titulo}</h2>
              <p>${libro.autor}</p>
              <p class="mono">ISBN: ${libro.isbn ?? '—'}</p>
                            <p>${libro.categoria ?? '—'} · ${libro.editorial ?? '—'}</p>
            </div>
            <a href="/libro.html?id=${libro.id}" class="edit" aria-label="Modificar libro">✏️</a>
          </div>
          <div class="meta">
            <span>Stock: ${libro.cantidad_total} (${prestados} prestados)</span>
            <span class="pill ${libro.activo ? '' : 'off'}">${libro.activo ? '● Disponible' : '● Inactivo'}</span>
          </div>
          <div class="avail">
            <div><b>Disponibilidad en catálogo</b><small>${libro.activo ? 'Activo para solicitud de préstamos' : 'Inactivo'}</small></div>
            ${libro.activo
              ? `<button class="tog" onclick="inactivarLibro(${libro.id})" aria-label="Inactivar libro"></button>`
              : `<button class="tog" disabled aria-label="Libro inactivo"></button>`}
          </div>
        </article>
      `;
    });
  } catch (error) {
    console.error('Error cargando libros:', error);
  }
}

// Agregar nuevo libro
document.getElementById('formLibro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nuevoLibro = {
    titulo: document.getElementById('titulo').value,
    autor: document.getElementById('autor').value,
    categoria: document.getElementById('categoria').value,
    editorial: document.getElementById('editorial').value,
    año_publicacion: parseInt(document.getElementById('año_publicacion').value),
    isbn: document.getElementById('isbn').value,
    cantidad_total: parseInt(document.getElementById('cantidad_total').value)
  };

  await fetch('/api/books', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(nuevoLibro)
  });

  document.getElementById('formLibro').reset();
  document.getElementById('okTxt').textContent = ` El registro de '${nuevoLibro.titulo}' fue incorporado al catálogo con ${nuevoLibro.cantidad_total} ejemplares.`;
  document.getElementById('okMsg').classList.add('show');
  document.getElementById('panelNuevo').classList.remove('show');
  cargarLibros();
});

// Inactivar libro
async function inactivarLibro(id) {
  if (confirm('¿Seguro que deseas inactivar este libro?')) {
    await fetch(`/api/books/${id}/inactivate`, { method: 'PATCH' });
    cargarLibros();
  }
}
</script>
<script src="/js/roles.js"></script>
<script src="/js/session.js"></script>
</body data-acceso="Admin">
</html>
