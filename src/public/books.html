<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración de Libros - Entre Libros</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>

    .switch-container {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      margin-top: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0f2540;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }
  </style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a href="/inicio.html" class="brand">
      <span class="mark">EL</span>
      <span><b>Entre Libros</b><small>Inventario</small></span>
    </a>
    <div class="top-right"><span class="badge">Admin</span><a href="/login.html" class="avatar">👤</a></div>
  </header>

  <div class="pagehead">
    <div>
      <h1>Administración de Libros</h1>
      <p>Control centralizado del acervo bibliográfico</p>
    </div>
  </div>


  <div class="search">
    <div class="field"><i>🔍</i>
      <input type="text" id="searchTitulo" placeholder="Buscar por título..." onkeyup="if(event.key==='Enter')cargarLibros()">
    </div>
    <button class="btn" onclick="cargarLibros()">Buscar</button>
  </div>

  <div class="chips">
    <strong style="font-size:.8rem;align-self:center">Categoría:</strong>
    <button class="chip" onclick="filtrar('Tecnología',this)">Tecnología</button>
    <button class="chip" onclick="filtrar('Literatura',this)">Literatura</button>
    <button class="chip" onclick="filtrar('Ciencia',this)">Ciencia</button>
    <button class="chip" onclick="filtrar('Historia',this)">Historia</button>
    <button class="chip on" onclick="filtrar('',this)">Ver Todas</button>
  </div>


  <div id="tablaLibros"></div>

</div>

<nav class="bottom">
  <a href="/catalogo.html"><span>📖</span>Explorar</a>
  <a href="/prestamos.html"><span>🔖</span>Préstamos</a>
  <a href="/books.html" class="on"><span>🗃️</span>Inventario</a>
  <a href="/inicio.html"><span>⚙️</span>Perfil</a>
</nav>
<script>
const token = sessionStorage.getItem('authToken');
let categoriaFiltro = '';

document.addEventListener('DOMContentLoaded', () => {
  cargarLibros();
});

function filtrar(cat, btn){
  categoriaFiltro = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  cargarLibros();
}

async function cargarLibros() {
  const titulo = document.getElementById('searchTitulo').value.trim();

  const params = new URLSearchParams();
  if (titulo) params.append('titulo', titulo);
  if (categoriaFiltro) params.append('categoria', categoriaFiltro);

  const url = `/api/books?${params.toString()}`;

  try {
    const headers = token ? { Authorization: 'Bearer ' + token } : {};
    const res = await fetch(url, { headers });
    const libros = await res.json();

    if (!Array.isArray(libros)) return;

    const cont = document.getElementById('tablaLibros');
    cont.innerHTML = libros.length ? '' : '<p class="empty">No hay libros registrados con ese filtro.</p>';

    libros.forEach(libro => {
      const prestados = Math.max(0, (libro.cantidad_total || 1) - (libro.cantidad_disponible || 0));
      const estaActivo = libro.activo !== false;

      cont.innerHTML += `
        <article class="book">
          <div class="book-top">
            <div class="cover">📕</div>
            <div class="book-info">
              <h2>${libro.titulo}</h2>
              <p>${libro.autor}</p>
              <p class="mono">ISBN: ${libro.isbn ?? '—'}</p>
              <p>${libro.categoria ?? '—'} · ${libro.editorial ?? '—'}</p>
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top: .8rem;">
            <b style="font-size:.9rem;">Stock: ${libro.cantidad_disponible ?? 0} (${prestados} prestados)</b>
            <span class="pill ${libro.cantidad_disponible > 0 ? '' : 'off'}">
              ${libro.cantidad_disponible > 0 ? '● Disponible' : '● Sin unidades'}
            </span>
          </div>

          <!-- INTERRUPTOR ACTIVO / INACTIVO -->
          <div class="switch-container">
            <div>
              <b style="font-size:.9rem; display:block;">Disponibilidad en catálogo</b>
              <small style="color:#64748b;">${estaActivo ? 'Activo para solicitud de préstamos' : 'Inactivo (Oculto)'}</small>
            </div>
            <label class="switch">
              <input type="checkbox" ${estaActivo ? 'checked' : ''} onchange="cambiarEstado(${libro.id}, this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </article>
      `;
    });
  } catch (error) {
    console.error('Error cargando libros:', error);
  }
}

async function cambiarEstado(id, activo) {
  if (!token) {
    alert('Tu sesión ha expirado. Por favor inicia sesión como Administrador.');
    location.href = '/login.html';
    return;
  }

  try {

    let res = await fetch(`/api/books/${id}/status`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ activo: activo, estado: activo })
    });

    if (res.status === 404) {
      res = await fetch(`/api/books/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ activo: activo })
      });
    }

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      alert('Error: ' + (data.error || 'No se pudo cambiar el estado del libro.'));
      cargarLibros(); 
      return;
    }

    cargarLibros(); 
  } catch (e) {
    alert('Error al conectar con el servidor.');
    cargarLibros();
  }
}
</script>
<script src="/js/roles.js"></script>
<script src="/js/session.js"></script>
</body>
</html>
