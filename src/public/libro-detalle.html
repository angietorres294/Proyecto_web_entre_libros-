<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Libro - Entre Libros</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a href="/catalogo.html" class="brand">
      <span class="mark">EL</span>
      <span><b>Entre Libros</b><small>Detalle</small></span>
    </a>
    <div class="top-right"><span class="badge">Lector</span></div>
  </header>

  <div class="backrow"><a href="/catalogo.html" class="back">← Volver al Catálogo</a></div>

  <div id="contenidoLibro"><p class="empty">Cargando detalles del libro...</p></div>

</div>

<script>
const params = new URLSearchParams(location.search);
const libroId = params.get('id');
const token = sessionStorage.getItem('authToken');
let unidadesDisponibles = 0;

async function cargarDetalle() {
  if (!libroId) {
    document.getElementById('contenidoLibro').innerHTML = '<p class="empty">Libro no especificado.</p>';
    return;
  }

  try {
    const res = await fetch('/api/books');
    const libros = await res.json();
    const libro = (Array.isArray(libros) ? libros : []).find(l => String(l.id) === String(libroId));

    if (!libro) {
      document.getElementById('contenidoLibro').innerHTML = '<p class="empty">Libro no encontrado.</p>';
      return;
    }

    unidadesDisponibles = libro.cantidad_disponible ?? 0;

    document.getElementById('contenidoLibro').innerHTML = `
      <div class="card" style="padding: 1.5rem; background:#fff; border-radius:18px;">
        <h1 style="margin: 0 0 .3rem;">${libro.titulo}</h1>
        <p style="margin: 0 0 1rem; color: #4a5b70;">por <b>${libro.autor}</b></p>
        
        <div style="display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom: 1.5rem;">
          <span class="badge">Editorial: ${libro.editorial || '—'}</span>
          <span class="badge">ISBN: ${libro.isbn || '—'}</span>
          <span class="badge">Año: ${libro['año_publicacion'] || '—'}</span>
        </div>

        <div class="meta" style="margin-bottom: 1.5rem;">
          <span class="pill ${unidadesDisponibles > 0 ? '' : 'off'}">${unidadesDisponibles > 0 ? `● Estado: Disponible (${unidadesDisponibles} unidades físicas)` : '● Sin unidades físicas'}</span>
        </div>

        <h3>📖 Sinopsis de la obra</h3>
        <p style="color: #4a5b70; line-height: 1.5; margin-bottom: 1.5rem;">
          ${libro.sinopsis || 'Sinopsis no disponible todavía.'}
        </p>

        <div style="background: #f1f5f9; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem;">
          <h4 style="margin:0 0 .5rem;">📅 Condiciones y Plazos del Préstamo</h4>
          <p style="margin:0; font-size:.9rem; color:#475569;">Duración estándar de préstamo: <b>14 días hábiles</b>.</p>
        </div>

        <!-- Botón siempre habilitado para poder registrar el click -->
        <button id="btnSolicitar" class="btn block" style="font-size: 1.05rem; padding: 0.9rem;">
          📦 Solicitar Préstamo Ahora
        </button>
      </div>
    `;

    document.getElementById('btnSolicitar').addEventListener('click', solicitarPrestamo);

  } catch (e) {
    document.getElementById('contenidoLibro').innerHTML = '<p class="empty">Error al cargar la información.</p>';
  }
}

async function solicitarPrestamo() {
  // 1. Verificación local de stock para responder inmediatamente
  if (unidadesDisponibles < 1) {
    alert('El libro no cuenta con unidades disponibles');
    return;
  }

  if (!token) {
    alert('Debes iniciar sesión para realizar la solicitud.');
    location.href = '/login.html';
    return;
  }

  const btn = document.getElementById('btnSolicitar');
  btn.disabled = true;

  try {
    const res = await fetch('/api/loans/request', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ libro_id: parseInt(libroId) })
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      alert(data.error || 'El libro no cuenta con unidades disponibles');
      btn.disabled = false;
      return;
    }

    alert('✅ ¡Préstamo solicitado exitosamente!');
    location.href = '/prestamos.html';

  } catch (error) {
    alert('Error al conectar con el servidor.');
    btn.disabled = false;
  }
}

cargarDetalle();
</script>
<script src="/js/roles.js"></script>
<script src="/js/session.js"></script>
</body>
</html>
