<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre Libros - Iniciar sesión</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">

    <header class="topbar">
        <a href="/" class="brand">
            <span class="mark">EL</span>
            <span><b>Entre Libros</b><small>Librería &amp; Catálogo</small></span>
        </a>
        <div class="top-right"><span class="badge">Mi Cuenta</span></div>
    </header>

    <section class="hero-img">
        <h1>Bienvenido a su biblioteca</h1>
        <p>Acceda al catálogo digital, reservas y gestión editorial.</p>
    </section>

    <div class="tabs">
        <a href="/login.html" class="on">Iniciar Sesión</a>
        <a href="/register.html">Registrarse</a>
    </div>

    <div class="notice"><strong>Aviso de Seguridad:</strong> Cierre automático de sesión tras 10 minutos de inactividad.</div>

    <form id="login-form" class="card">
        <label for="correo">Correo Electrónico <small>Requerido</small></label>
        <div class="field">
            <i>✉️</i>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@entrelibros.com" required>
        </div>

        <label for="contraseña">Contraseña <a href="/recuperar.html" class="forgot">¿Olvidaste tu contraseña?</a></label>
        <div class="field">
            <i>🔒</i>
            <input type="password" id="contraseña" name="contraseña" placeholder="••••••••" required>
            <button type="button" class="eye" onclick="verClave('contraseña')" aria-label="Mostrar contraseña">👁️</button>
        </div>

        <p id="auth-message" class="msg"></p>
        <button type="submit" class="btn block">Iniciar Sesión →</button>
    </form>

    <p class="alt">¿No tienes una cuenta? <a href="/register.html"><b>Regístrate aquí</b></a></p>

</div>

<script>
function verClave(id){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';}
</script>
<script src="/js/auth.js"></script>
<script src="/js/session.js"></script>
<script>
if (new URLSearchParams(location.search).get('expirada')) {
    document.getElementById('auth-message').textContent =
        'Tu sesión se cerró por inactividad. Inicia sesión de nuevo.';
}
</script>
</body>
</html>
