<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar Catálogo - Entre Libros</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a href="/inicio.html" class="brand">
      <span class="mark">EL</span>
      <span><b>Entre Libros</b><small>Explorar Catálogo</small></span>
    </a>
    <div class="top-right"><span class="badge">Lector</span><a href="/inicio.html" class="avatar">👤</a></div>
  </header>

  <div class="search big">
    <div class="field"><i>🔍</i>
      <input type="text" id="q" placeholder="Buscar por título, autor o temática...">
    </div>
  </div>
  <div class="idx"><span>⚡ Búsqueda en tiempo real</span><span id="indexados">0 títulos indexados</span></div>

  <div class="chips" id="chips">
    <button class="chip on" data-f="">Todos</button>
    <button class="chip" data-f="novela">Novelas</button>
    <button class="chip" data-f="ciencia">Ciencia Ficción</button>
    <button class="chip" data-f="tecnolog">Tecnología</button>
    <button class="chip" data-f="historia">Historia</button>
    <button class="chip" data-f="filosof">Filosofía</button>
    <button class="chip" data-f="infantil">Infantil</button>
  </div>

  <div id="lista"></div>
</div>

<nav class="bottom">
  <a href="/catalogo.html" class="on"><span>📖</span>Explorar</a>
  <a href="/prestamos.html"><span>🔖</span>Préstamos</a>
  <a href="/pago-multas.html"><span>💳</span>Multas</a>
  <a href="/inicio.html"><span>⚙️</span>Perfil</a>
</nav>

<script>
const $ = id => document.getElementById(id);
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function esc(texto) {
  const div = document.createElement('div');
  div.textContent = texto ?? '';
  return div.innerHTML;
}

let libros = [], filtro = '';

async function cargar() {
  try {
    const res = await fetch('/api/books');
    const datos = await res.json();
    libros = Array.isArray(datos)
      ? datos.filter(l => l.activo !== false && l.activo !== 'false')
      : [];
    pintar();
  } catch (e) {
    $('lista').innerHTML = '<p class="empty">No se pudo cargar el catálogo.</p>';
  }
}

function pintar() {
  const t = norm($('q').value.trim());
  const lista = libros.filter(l =>
    (!filtro || norm(l.categoria).includes(filtro)) &&
    (!t || norm(`${l.titulo} ${l.autor} ${l.categoria}`).includes(t))
  );
  $('indexados').textContent = `${lista.length} títulos indexados`;
  $('lista').innerHTML = lista.length ? lista.map(tarjeta).join('') : '<p class="empty">No encontramos libros con esa búsqueda.</p>';
}

function tarjeta(l) {
  const disp = l.cantidad_disponible ?? 0;
  const hue = (l.id * 47) % 360;
  return `
  <article class="book" id="b${l.id}">
    <div class="book-top">
      <div class="cover" style="background:linear-gradient(135deg,hsl(${hue} 45% 32%),hsl(${hue} 55% 16%))">📕</div>
      <div class="book-info">
        <span class="tagc">${esc(l.categoria ?? 'Sin categoría')}</span>
        <h2>${esc(l.titulo)}</h2>
        <p>${esc(l.autor)}</p>
        <span class="pill ${disp > 0 ? '' : 'off'}">${disp > 0 ? `● Disponible (${disp} unidades)` : '● Sin unidades (Disponible para reserva)'}</span>
      </div>
    </div>
    <div class="acts" style="justify-content: flex-end;">
      <a class="btn" href="/libro-detalle.html?id=${l.id}">📖 Detalle del libro</a>
    </div>
  </article>`;
}

$('q').addEventListener('input', pintar);
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  filtro = c.dataset.f;
  pintar();
});

cargar();
</script>
<script src="/js/roles.js"></script>
<script src="/js/session.js"></script>
</body>
</html>
