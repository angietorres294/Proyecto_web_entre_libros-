<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entre Libros - Módulo de Reportes</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
    <header class="navbar">
    <a href="/inicio.html" class="logo">Entre Libros</a>
  </header>
  <main class="page">
    <section class="hero">
      <h2>Dashboard de Reportes y Estadísticas</h2>
      <p>Resumen del catálogo, los usuarios y los préstamos de la biblioteca.</p>
    </section>

    <div class="card-grid">
      <div class="card">
        <h3>Libros Registrados</h3>
        <p class="stat-number" id="total-books">0</p>
      </div>
      <div class="card">
        <h3>Usuarios Activos</h3>
        <p class="stat-number" id="total-users">0</p>
      </div>
      <div class="card">
        <h3>Préstamos Activos</h3>
        <p class="stat-number" id="active-loans">0</p>
      </div>
    </div>
  </main>

</script>
<script src="/js/roles.js"></script>
<script src="/js/session.js"></script>
<script src="/js/reports.js"></script>
</body data-acceso="Admin">
</html>
